apiVersion: v1 
kind: Pod 
metadata:
  name: nginx-tolerated 
  labels:
    project: roboshop 
    environment: dev 
    purpose: poc
spec:
  containers:
  - name: nginx 
    image: nginx 
  tolerations:
  - key: "hardware"
    operator: "Equal"
    value: "gpu"
    effect: "NoExecute"
  nodeSelector:
    project: roboshop 
