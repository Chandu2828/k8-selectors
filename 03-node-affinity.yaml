apiVersion: v1
kind: Pod
metadata:
  name: with-node-affinity
spec:
  containers: 
  - name: nginx 
    image: nginx 
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - us-east-1f
            - us-east-1c
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: topology.kubernetes.io/zone 
            operator: In 
            values:
            - us-east-1f
      - weight: 10 
        preference:
          matchExpressions:
          - key: topology.kubernetes.io/zone 
            operator: In 
            values:
            - us-east-1c 
  