apiVersion: v1
kind: Pod
metadata:
  name: with-node-affinity
spec:
  containes: 
  - name: nginx 
    image: nginx 
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - us-east-1f
            - us-east-1a