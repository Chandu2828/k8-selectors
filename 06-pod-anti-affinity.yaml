apiVersion: v1 
kind: Pod 
metadata:
  name: pod-3 
  labels:
    project: roboshop 
    tier: database 
spec:
  containers:
  - name: nginx 
    image: nginx 
---
apiVersion: v1 
kind: Pod 
metadata:
  name: pod-4
  labels:
    project: roboshop
    tier: database
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: tier
            operator: In 
            values:
            - database 
        topologyKey: "kubernetes.io/hostname" # border is host 
      # The pod can land in any host other than where the pod-3 is running
  containers:
  - name: nginx 
    image: nginx