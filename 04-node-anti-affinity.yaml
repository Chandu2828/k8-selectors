apiVersion: v1 
kind: Pod 
metadata:
  name: with-node-anti-affinity
spec:
  affinity:
    nodeAffinity: 
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone 
            operator: In 
            values:
            - us-east-1f 
            - us-east-1c
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions: 
          - key: topology.kubernetes.io/zone 
            operator: NotIn 
            values:
            - us-east-1c
      - weight: 10 
        preference: 
          matchExpressions:
          - key: topology.kuberentes.io/zone 
            operator: In 
            values: 
            - us-east-1f
  containers:
  - name: nginx 
    image: nginx 